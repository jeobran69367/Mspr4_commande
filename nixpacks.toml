[phases.setup]
nixPkgs = ["python311", "postgresql"]

[phases.install]
cmds = ["pip install -r api-orders/requirements.txt"]

[phases.build]
cmds = ["sh -c 'cd api-orders && python -c \"import app.main\"'"]

[start]
cmd = "sh -c 'cd api-orders && export PYTHONPATH=${PYTHONPATH}:$(pwd) && alembic upgrade head || true && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8003}'"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"