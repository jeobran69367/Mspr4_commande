# Optional RabbitMQ service - Use this if you don't have a shared RabbitMQ instance running
# To start RabbitMQ separately: docker-compose -f docker-compose.rabbitmq.yml up -d

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: payetonkawa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: payetonkawa
      RABBITMQ_DEFAULT_PASS: payetonkawa123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data:
