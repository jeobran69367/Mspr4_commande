services:
  orders-db:
    image: postgres:15-alpine
    container_name: orders-db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_password
    ports:
      - "5435:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-api
    depends_on:
      orders-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://orders_user:orders_password@orders-db:5432/orders_db
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: payetonkawa
      RABBITMQ_PASSWORD: payetonkawa123
      API_PORT: 8003
      CUSTOMER_SERVICE_URL: http://host.docker.internal:8001
      PRODUCT_SERVICE_URL: http://host.docker.internal:8002
    ports:
      - "8003:8003"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload"

volumes:
  orders-db-data:
