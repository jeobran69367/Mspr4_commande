version: '3.8'

services:
  orders-db-test:
    image: postgres:15-alpine
    container_name: orders-db-test
    environment:
      POSTGRES_DB: orders_test_db
      POSTGRES_USER: orders_test_user
      POSTGRES_PASSWORD: orders_test_password
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_test_user -d orders_test_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq-test:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-test
    environment:
      RABBITMQ_DEFAULT_USER: test_user
      RABBITMQ_DEFAULT_PASS: test_pass
    ports:
      - "5673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
