# generic single-database configuration.

[alembic]
# Chemin réel vers les migrations
script_location = migrations

# Template de nommage des fichiers de migration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Ajoute la racine du projet au PYTHONPATH
prepend_sys_path = .

version_path_separator = os

# ⚠️ IMPORTANT : Alembic DOIT utiliser un driver SYNCHRONE
sqlalchemy.url = postgresql://orders_user:orders_password@localhost:5435/orders_db


[post_write_hooks]
# (inchangé)


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
